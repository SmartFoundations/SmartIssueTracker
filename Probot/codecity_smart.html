// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.FogExp2(0x0a0e17, 0.0008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 10;
controls.maxDistance = 2000;

// Lighting
const ambient = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(200, 400, 200);
dirLight.castShadow = true;
scene.add(dirLight);
const hemi = new THREE.HemisphereLight(0x818cf8, 0x1e293b, 0.3);
scene.add(hemi);

// Color palette by directory depth
const COLORS = [
  0xc084fc, 0x818cf8, 0x38bdf8, 0x34d399, 0xfbbf24,
  0xf472b6, 0xa78bfa, 0x22d3ee, 0x4ade80, 0xfb923c,
];

function dirColor(dir) {
  let hash = 0;
  for (let i = 0; i < dir.length; i++) hash = ((hash << 5) - hash + dir.charCodeAt(i)) | 0;
  return COLORS[Math.abs(hash) % COLORS.length];
}

// Ground grid
const gridSize = 2000;
const grid = new THREE.GridHelper(gridSize, 100, 0x1a1f35, 0x111827);
grid.position.y = -0.1;
scene.add(grid);

// Districts (ground planes)
const districtMeshes = [];
DATA.districts.forEach(d => {
  const geo = new THREE.BoxGeometry(d.width, 0.3, d.depth);
  const mat = new THREE.MeshPhongMaterial({
    color: dirColor(d.name),
    transparent: true,
    opacity: 0.15,
    shininess: 10,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(d.x + d.width/2, 0.15, d.z + d.depth/2);
  mesh.receiveShadow = true;
  scene.add(mesh);
  districtMeshes.push(mesh);
});

// Buildings
const buildingMeshes = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const HEIGHT_SCALE = 2.5;

DATA.buildings.forEach(b => {
  const h = b.height * HEIGHT_SCALE;
  const geo = new THREE.BoxGeometry(b.size * 0.9, h, b.size * 0.9);
  const color = dirColor(b.dir);
  const mat = new THREE.MeshPhongMaterial({
    color: color,
    emissive: new THREE.Color(color).multiplyScalar(0.15),
    shininess: 60,
    transparent: true,
    opacity: 0.85,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(b.x + b.size/2, h/2, b.z + b.size/2);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = b;
  scene.add(mesh);
  buildingMeshes.push(mesh);
});

// Call edges (arcs)
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);

function buildEdges() {
  while(edgeGroup.children.length > 0) edgeGroup.remove(edgeGroup.children[0]);
  const BS = DATA.buildings.length > 0 ? DATA.buildings[0].size : 3;
  
  DATA.edges.forEach(e => {
    const sx = e.sx + BS/2, sz = e.sz + BS/2;
    const dx = e.dx + BS/2, dz = e.dz + BS/2;
    const sh = e.sh * HEIGHT_SCALE;
    const dh = e.dh * HEIGHT_SCALE;
    
    const dist = Math.sqrt((dx-sx)**2 + (dz-sz)**2);
    const arcH = Math.max(sh, dh) + dist * 0.15 + 5;
    
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(sx, sh, sz),
      new THREE.Vector3((sx+dx)/2, arcH, (sz+dz)/2),
      new THREE.Vector3(dx, dh, dz)
    );
    const pts = curve.getPoints(20);
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.12 });
    const line = new THREE.Line(geo, mat);
    edgeGroup.add(line);
  });
}
buildEdges();

// Center camera on the scene
const bbox = new THREE.Box3();
buildingMeshes.forEach(m => bbox.expandByObject(m));
const center = new THREE.Vector3();
bbox.getCenter(center);
const size = new THREE.Vector3();
bbox.getSize(size);
const maxDim = Math.max(size.x, size.z);

camera.position.set(center.x + maxDim * 0.5, maxDim * 0.6, center.z + maxDim * 0.5);
controls.target.copy(center);

// Tooltip
const tooltip = document.getElementById('tooltip');
let hoveredMesh = null;
let originalColor = null;

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(buildingMeshes);
  
  if (hits.length > 0) {
    const mesh = hits[0].object;
    const b = mesh.userData;
    
    if (hoveredMesh !== mesh) {
      if (hoveredMesh && originalColor) hoveredMesh.material.emissive.copy(originalColor);
      hoveredMesh = mesh;
      originalColor = mesh.material.emissive.clone();
      mesh.material.emissive.set(0xffffff);
      mesh.material.emissive.multiplyScalar(0.4);
    }
    
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 15) + 'px';
    tooltip.style.top = (event.clientY + 15) + 'px';
    tooltip.querySelector('.tt-name').textContent = b.name;
    tooltip.querySelector('.tt-dir').textContent = b.dir;
    tooltip.querySelector('.tt-stats').innerHTML =
      '<span>' + b.funcs + '</span> functions &bull; <span>' + b.classes + '</span> classes &bull; ' + b.lang;
  } else {
    if (hoveredMesh && originalColor) {
      hoveredMesh.material.emissive.copy(originalColor);
      hoveredMesh = null;
    }
    tooltip.style.display = 'none';
  }
}
window.addEventListener('mousemove', onMouseMove, false);

// Filters
document.getElementById('showEdges').addEventListener('change', e => {
  edgeGroup.visible = e.target.checked;
});

// Labels
const labelSprites = [];
function toggleLabels(show) {
  if (show && labelSprites.length === 0) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    DATA.buildings.forEach(b => {
      canvas.width = 256; canvas.height = 64;
      ctx.clearRect(0,0,256,64);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '16px sans-serif';
      ctx.fillText(b.name, 4, 20);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7 });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(b.x + b.size/2, b.height * HEIGHT_SCALE + 2, b.z + b.size/2);
      sprite.scale.set(10, 2.5, 1);
      scene.add(sprite);
      labelSprites.push(sprite);
    });
  }
  labelSprites.forEach(s => s.visible = show);
}
document.getElementById('showLabels').addEventListener('change', e => toggleLabels(e.target.checked));

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
